name: Build LunaTV Android

on:
  push:
    branches: [claude/revision-analysis-1foe65, main]
    paths:
      - "lunatv-android/**"
      - ".github/workflows/build-lunatv-android.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lunatv-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 (API 36) platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # Optional: add repository secrets LUNATV_KEYSTORE_BASE64 (base64 of the .jks)
      # and LUNATV_KEYSTORE_PASSWORD to get a release build signed with your key.
      - name: Restore release signing key
        env:
          LUNATV_KEYSTORE_BASE64: ${{ secrets.LUNATV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$LUNATV_KEYSTORE_BASE64" ]; then
            echo "$LUNATV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lunatv-release.jks"
            echo "LUNATV_KEYSTORE=$RUNNER_TEMP/lunatv-release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: release builds stay unsigned; the debug APK is installable."
          fi

      - name: Lint, then build APKs and the Play Store bundle
        env:
          LUNATV_KEYSTORE_PASSWORD: ${{ secrets.LUNATV_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon lintRelease assembleDebug assembleRelease bundleRelease

      - name: Remove the restored key
        if: always()
        run: rm -f "$RUNNER_TEMP/lunatv-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: lunatv-android
          path: |
            lunatv-android/app/build/outputs/apk/debug/*.apk
            lunatv-android/app/build/outputs/apk/release/*.apk
            lunatv-android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lunatv-android-lint
          path: lunatv-android/app/build/reports/lint-results-release.html
          if-no-files-found: ignore
