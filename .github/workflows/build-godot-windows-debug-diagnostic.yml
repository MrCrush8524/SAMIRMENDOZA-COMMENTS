name: DIAGNOSTIC - In Samir's Mind Windows debug build (console output)

# TEMPORARY diagnostic workflow only - manual dispatch only, never runs on
# push. Produces a DEBUG export (not release) of the exact same resource
# selection as the real Windows Desktop preset, so it carries a console
# window (debug/export_console_wrapper=1 in export_presets.cfg means the
# release build has no console at all - this is the only way to see
# Godot's own startup error output on the tester's machine). Not for
# distribution - delete this file once the startup failure is diagnosed.

on:
  workflow_dispatch: {}

env:
  GODOT_VERSION: "4.3-stable"
  GODOT_VERSION_FOLDER: "4.3.stable"

jobs:
  build-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: in-samirs-mind-godot
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor + export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot editor + export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          cd ~/godot
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 godot4
          chmod +x godot4
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION_FOLDER}
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION_FOLDER}/

      - name: Import project
        run: ~/godot/godot4 --headless --path . --import

      - name: Set up rcedit (embeds the app icon/version info into the .exe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine64
          curl -sSL -o "$HOME/rcedit-x64.exe" "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/windows/rcedit = "$HOME/rcedit-x64.exe"
          export/windows/wine = "/usr/bin/wine"
          EOF

      - name: Export Windows DEBUG build (same resource selection as production, console-enabled)
        run: |
          mkdir -p build/windows-debug-diagnostic
          ~/godot/godot4 --headless --path . --export-debug "Windows Desktop" build/windows-debug-diagnostic/InSamirsMind-DIAGNOSTIC.exe

      - name: Upload debug diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: in-samirs-mind-windows-DEBUG-DIAGNOSTIC
          path: in-samirs-mind-godot/build/windows-debug-diagnostic/
          if-no-files-found: error
