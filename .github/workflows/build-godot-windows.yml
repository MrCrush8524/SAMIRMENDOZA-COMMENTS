name: Build In Samir's Mind (Windows)

on:
  push:
    branches: [claude/backrooms-map-threejs-rbc3q3]
    paths:
      - "in-samirs-mind-godot/**"
      - ".github/workflows/build-godot-windows.yml"
  workflow_dispatch: {}

env:
  GODOT_VERSION: "4.3-stable"
  GODOT_VERSION_FOLDER: "4.3.stable"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: in-samirs-mind-godot
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor + export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot editor + export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          cd ~/godot
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 godot4
          chmod +x godot4
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION_FOLDER}
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION_FOLDER}/

      - name: Import project
        run: ~/godot/godot4 --headless --path . --import

      - name: Set up rcedit (embeds the app icon/version info into the .exe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine64
          curl -sSL -o "$HOME/rcedit-x64.exe" "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe"
          mkdir -p ~/.config/godot
          # Godot's Windows export only injects the custom icon/version info
          # (application/modify_resources=true in export_presets.cfg) when it
          # can shell out to rcedit - and on a Linux runner that means telling
          # it to run rcedit.exe through Wine. Without this, the exported
          # .exe silently falls back to Godot's own default icon.
          cat > ~/.config/godot/editor_settings-4.3.tres << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/windows/rcedit = "$HOME/rcedit-x64.exe"
          export/windows/wine = "/usr/bin/wine"
          EOF

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          ~/godot/godot4 --headless --path . --export-release "Windows Desktop" build/windows/InSamirsMind.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: in-samirs-mind-windows
          path: in-samirs-mind-godot/build/windows/
          if-no-files-found: error
