name: Build SMR Android APK

on:
  push:
    branches: [claude/smr-android-app-21z2np, claude/backrooms-map-threejs-rbc3q3]
    paths:
      - "smr-android/**"
      - ".github/workflows/build-smr-android.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smr-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest runners ship with an Android SDK already installed at $ANDROID_HOME,
      # including recent platforms/build-tools. Just make sure the platform this project
      # compiles against (34) and licenses are present rather than pulling in
      # android-actions/setup-android, which tries to install the long-removed legacy
      # "tools" package and fails outright on current SDK repository metadata.
      - name: Ensure required SDK packages are installed
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smr-stories-made-real-debug
          path: smr-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
