name: Build AMB Windows EXE

concurrency:
  group: amb-windows
  cancel-in-progress: true

on:
  push:
    branches: [claude/prototype-build-netlify-hekxd7]
    paths:
      - "amb-desktop/**"
      - "anthonys-music-box/**"
      - ".github/workflows/build-amb-windows.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: amb-desktop
    steps:
      # The repo also holds large game projects; fetch only what the app needs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            amb-desktop
            anthonys-music-box
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build installer and portable EXE
        run: npm run dist

      - name: Version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMB-windows-${{ steps.v.outputs.version }}
          path: amb-desktop/dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: amb-windows-v${{ steps.v.outputs.version }}-build${{ github.run_number }}
          name: AMB for Windows ${{ steps.v.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: amb-desktop/dist/*.exe
          body: |
            Anthony's Music Box for Windows, version ${{ steps.v.outputs.version }}.

            - **AMB-Setup-${{ steps.v.outputs.version }}.exe**: installs AMB with Start menu and desktop shortcuts.
            - **AMB-Portable-${{ steps.v.outputs.version }}.exe**: runs without installing.

            The app isn't code-signed, so Windows SmartScreen may say "Windows protected your PC". Click **More info → Run anyway**.
