<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VIDeX</title>
<meta name="description" content="VIDeX: your local videos, worldwide free live TV and YouTube in one player.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VIDeX">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="logo-mark.webp" as="image">
<link rel="stylesheet" href="css/app.css">
<script>
  // Last-resort guard: if the app can't start at all, say so instead of a black page.
  window.__videxFatal = function (e) {
    var b = document.querySelector(".boot"); if (!b) return;
    b.innerHTML = '<div style="text-align:center;padding:24px;max-width:340px;font:15px/1.45 -apple-system,system-ui,sans-serif;color:#c8d3de"><img src="logo-mark.webp" alt="VIDeX" style="width:220px;margin:0 auto 18px"><b style="color:#fff;font-size:18px">VIDeX couldn’t start</b><p>' + String((e && e.message) || e || "Unknown error").replace(/[<>&]/g, "") + '</p><button onclick="location.reload()" style="margin-top:8px;padding:10px 20px;border-radius:20px;border:0;background:#159cff;color:#fff;font:600 15px system-ui">Reload</button></div>';
  };
  window.addEventListener("error", function (e) { if (!document.body.classList.contains("ready") && e.target && e.target.tagName === "SCRIPT") window.__videxFatal(new Error("A file failed to load. Check your connection.")); }, true);
  setTimeout(function () { if (!document.body.classList.contains("ready")) window.__videxFatal(new Error("Startup took too long. This browser may be too old, or a file failed to load.")); }, 15000);
</script>
<script type="module" src="js/app.js"></script>
<script nomodule>window.addEventListener("DOMContentLoaded",function(){window.__videxFatal(new Error("This browser is too old for VIDeX. Update to iOS 15+ or a current browser."))});</script>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
<main>
  <div class="tab" id="tab-home"></div>
  <div class="tab" id="tab-live"></div>
  <div class="tab" id="tab-youtube"></div>
  <div class="tab active" id="tab-library"></div>
  <div class="tab" id="tab-search"></div>
</main>
<nav class="dock" aria-label="Main">
  <button data-tab="home"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.2 12 4l9 7.2V20a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg>Home</button>
  <button data-tab="live"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M8.2 8.2a5.4 5.4 0 0 0 0 7.6M15.8 8.2a5.4 5.4 0 0 1 0 7.6M5.3 5.3a9.5 9.5 0 0 0 0 13.4M18.7 5.3a9.5 9.5 0 0 1 0 13.4"/></svg>Live TV</button>
  <button data-tab="youtube"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="3.5" fill="currentColor"/><path d="M10 9v6l5-3z" fill="#05101c"/></svg>YouTube</button>
  <button data-tab="library" class="active" aria-current="page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 7.5a2 2 0 0 1 2-2h4.8l2 2.2h8.2a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2h-15a2 2 0 0 1-2-2z" fill="currentColor"/></svg>Library</button>
  <button data-tab="search"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>Search</button>
</nav>
<div class="boot"><img src="logo-mark.webp" alt="VIDeX"></div>
<noscript><p style="position:fixed;inset:auto 0 40% 0;text-align:center;color:#c8d3de;z-index:1000">VIDeX needs JavaScript.</p></noscript>
</body>
</html>
