<link rel="icon" href="assets/icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preload" href="assets/branding/lunatv-crescent.webp" as="image">
<link rel="stylesheet" href="css/app.css">
<script>
  try { if (localStorage.getItem("lunatv.reduceMotion") === "1") document.documentElement.classList.add("reduce-motion"); } catch (e) {}
  // Last-resort guard: if LunaTV can't start, say so instead of a black page.
  window.__lunaFatal = function (e) {
    var b = document.querySelector(".boot"); if (!b) return;
    b.innerHTML = '<div class="boot-fail"><img src="assets/branding/lunatv-crescent.webp" alt="" width="96" height="85"><b>LunaTV couldn’t start</b><p>' + String((e && e.message) || e || "Unknown error").replace(/[<>&]/g, "") + '</p><button onclick="location.reload()">Reload</button></div>';
  };
  addEventListener("error", function (e) { if (!document.body.classList.contains("ready") && e.target && e.target.tagName === "SCRIPT") window.__lunaFatal(new Error("A file failed to load. Check your connection.")); }, true);
  setTimeout(function () { if (!document.body.classList.contains("ready")) window.__lunaFatal(new Error("Startup took too long. This browser may be too old, or a file failed to load.")); }, 20000);
</script>
<script type="module" src="js/app.js"></script>
<script nomodule>addEventListener("DOMContentLoaded",function(){window.__lunaFatal(new Error("This browser is too old for LunaTV. Update to iOS 15 or a current browser."))});</script>
</head>
