<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AMB">
<meta name="application-name" content="AMB">
<meta name="description" content="Anthony's Music Box — a private player for the music on your device.">
<meta name="format-detection" content="telephone=no">
<title>Anthony's Music Box</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="preload" href="assets/wolf.webp" as="image" type="image/webp">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="boot" aria-hidden="true">
  <img src="assets/wolf.webp" alt="">
  <p class="boot-fail">AMB needs a current browser (Safari 15+, Chrome, Edge or Firefox).<br>Please update and reload.</p>
</div>

<div id="bg" aria-hidden="true"><i class="g1"></i><i class="g2"></i><i class="g3"></i><i class="grain"></i></div>

<aside id="sidebar" aria-label="Sidebar">
  <div class="sb-brand"><img src="assets/wolf.webp" alt=""><div><b>Anthony's Music Box</b><small>AMB</small></div></div>
  <nav class="sb-tabs" aria-label="Main">
    <button data-tab="home" class="on"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg><span>Home</span></button>
    <button data-tab="library"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="3.2" height="16" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="10.4" y="4" width="3.2" height="16" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="16.8" y="4" width="3.2" height="16" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>Library</span></button>
    <button data-tab="search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.2 15.2 5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span>Search</span></button>
  </nav>
  <div id="sidebarLinks" class="sb-links"></div>
</aside>

<header id="navbar">
  <div class="nav-inner">
    <button id="navBack" class="nav-back" hidden data-act-back><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4.5-7.5 7.5 7.5 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="navBackLabel"></span></button>
    <div id="navTitle" class="nav-title" aria-hidden="true"></div>
    <div id="navActions" class="nav-actions"></div>
  </div>
</header>

<main id="stage" tabindex="-1"></main>

<div id="dock">
  <div id="importBar" class="glass" hidden role="status" aria-live="polite">
    <span class="spinner"></span><div><b id="importText">Importing</b><small id="importName"></small></div>
    <div class="import-track"><i id="importFill"></i></div>
  </div>
  <div id="selbar" class="glass" hidden>
    <button class="link" data-act="selAll">All</button>
    <span id="selCount">Select songs</span>
    <div class="sel-actions">
      <button class="icon-btn" data-act="selFav" aria-label="Favorite selected">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.4-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.6 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg></button>
      <button class="icon-btn" data-act="selNext" aria-label="Play selected next">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M4 11h10M4 16h6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M15 13.5v6l5-3z" fill="currentColor"/></svg></button>
      <button class="icon-btn" data-act="selAdd" aria-label="Add selected to a playlist">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h12M4 11h12M4 16h7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M17 13.5v7M13.5 17h7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button>
      <button class="icon-btn danger" data-act="selRemove" aria-label="Remove selected from AMB">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6.5h15M9.5 6.5V4.8h5v1.7M6.5 6.5l.9 12.2a1.5 1.5 0 0 0 1.5 1.3h6.2a1.5 1.5 0 0 0 1.5-1.3l.9-12.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>
  <div id="mini" class="glass" hidden>
    <button class="mini-open" aria-label="Open Now Playing">
      <img id="miniArt" src="assets/default-cover.webp" alt="" draggable="false">
      <span class="mini-text"><b id="miniTitle"></b><small id="miniArtist"></small></span>
    </button>
    <button id="miniPlay" class="icon-btn mini-btn" aria-label="Play"></button>
    <button id="miniPip" class="icon-btn mini-btn" aria-label="Picture in Picture" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="11.5" y="11" width="7.5" height="6" rx="1.3" fill="currentColor"/></svg></button>
    <button id="miniNext" class="icon-btn mini-btn" aria-label="Next song"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.2v13.6a.9.9 0 0 0 1.38.76l10.1-6.8a.9.9 0 0 0 0-1.52L6.38 4.44A.9.9 0 0 0 5 5.2z" fill="currentColor"/><rect x="17.6" y="4.5" width="2.6" height="15" rx="1.1" fill="currentColor"/></svg></button>
    <span class="mini-prog" aria-hidden="true"><i id="miniProg"></i></span>
  </div>
  <nav id="tabbar" class="glass" aria-label="Main">
    <button data-tab="home" class="on" aria-current="page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg><span>Home</span></button>
    <button data-tab="library"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="3.2" height="16" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="10.4" y="4" width="3.2" height="16" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="16.8" y="4" width="3.2" height="16" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>Library</span></button>
    <button data-tab="search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.2 15.2 5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span>Search</span></button>
  </nav>
</div>

<section id="np" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="Now Playing">
  <div class="np-bg" aria-hidden="true"><img class="np-bgimg" alt=""><img class="np-bgimg" alt=""><i class="np-shade"></i></div>
  <div class="np-inner">
    <div class="np-top">
      <button id="npClose" class="icon-btn" aria-label="Close Now Playing"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="np-label"><span>ANTHONY'S MUSIC BOX</span><small id="npContext"></small></div>
      <button id="npMore" class="icon-btn" aria-label="More options"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg></button>
    </div>
    <div class="np-body">
      <div class="np-stage">
        <div class="np-artwrap"><img id="npArt" src="assets/default-cover.webp" alt="" draggable="false"><video id="video" playsinline webkit-playsinline preload="auto" autopictureinpicture x-webkit-airplay="allow" aria-label="Video"></video><div class="pip-note" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="11.5" y="11" width="7.5" height="6" rx="1.3" fill="currentColor"/></svg><span>Playing in Picture in Picture</span></div><span class="live-badge">LIVE</span></div>
        <div id="lyricsView" class="np-lyrics" hidden aria-live="off"></div>
      </div>
      <div class="np-panel">
        <div class="np-meta">
          <div class="np-titles"><h2 id="npTitle"></h2><button id="npArtist" class="np-artist"></button></div>
          <button id="npFav" class="icon-btn np-fav" aria-label="Add to Favorites"></button>
        </div>
        <div id="npError" class="np-error" hidden><span id="npErrorText"></span><button id="npErrSkip" class="link">Skip</button></div>
        <div class="np-progress">
          <div id="seekRail" class="rail"><span class="fill"></span></div>
          <div class="times"><span id="npElapsed">0:00</span><span class="live-pill">● LIVE</span><span id="npRemain">-0:00</span></div>
        </div>
        <div class="np-transport">
          <button id="npPrev" class="icon-btn tr" aria-label="Previous"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5.2v13.6a.9.9 0 0 1-1.38.76L7.52 12.76a.9.9 0 0 1 0-1.52l10.1-6.8A.9.9 0 0 1 19 5.2z" fill="currentColor"/><rect x="3.8" y="4.5" width="2.6" height="15" rx="1.1" fill="currentColor"/></svg></button>
          <button id="npPlay" class="icon-btn tr big" aria-label="Play"></button>
          <button id="npNext" class="icon-btn tr" aria-label="Next"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.2v13.6a.9.9 0 0 0 1.38.76l10.1-6.8a.9.9 0 0 0 0-1.52L6.38 4.44A.9.9 0 0 0 5 5.2z" fill="currentColor"/><rect x="17.6" y="4.5" width="2.6" height="15" rx="1.1" fill="currentColor"/></svg></button>
        </div>
        <div id="npVolRow" class="np-volume">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3l4-3.5v12l-4-3.5H4z" fill="currentColor"/></svg>
          <div id="volRail" class="rail"><span class="fill"></span></div>
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5h3l4-3.5v12l-4-3.5H3z" fill="currentColor"/><path d="M14 9a4 4 0 0 1 0 6M16.8 6.3a8 8 0 0 1 0 11.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
        <button id="npModes" class="np-modes" hidden aria-label="Playback modes, open queue"></button>
        <div class="np-dock glass">
          <button id="npLyrics" aria-pressed="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="3.5" width="15" height="17" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 8.5h8M8 12h8M8 15.5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Lyrics</span></button>
          <button id="npPip" hidden aria-pressed="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="11.5" y="11" width="7.5" height="6" rx="1.3" fill="currentColor"/></svg><span>Picture in Picture</span></button>
          <button id="npOutput" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 21h8l-4-5z" fill="currentColor"/></svg><span>Output</span></button>
          <button id="npQueue"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Queue</span></button>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="sheetLayer" hidden>
  <div class="scrim"></div>
  <div class="sheet glass" role="dialog" aria-modal="true">
    <div class="sheet-grab" aria-hidden="true"><i></i></div>
    <div class="sheet-head"><h2 class="sheet-title"></h2><div class="sheet-right"></div><button class="icon-btn sheet-close" aria-label="Close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6.5 6.5 11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>
    <div class="sheet-body"></div>
  </div>
</div>

<div id="toasts" role="status" aria-live="polite"></div>
<div id="dropHint" aria-hidden="true"><div class="glass"><b>Drop music to add it to AMB</b><small>Nothing is uploaded</small></div></div>

<input id="fileInput" type="file" accept="audio/*,video/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.oga,.opus,.mp4,.m4v,.mov,.webm" multiple hidden>
<input id="folderInput" type="file" webkitdirectory multiple hidden>
<audio id="audio" playsinline preload="auto" x-webkit-airplay="allow"></audio>
</body>
</html>
